name = "verbum-lucis"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Output dell'adapter @astrojs/cloudflare (per `wrangler deploy`)
main = "./dist/_worker.js/index.js"
assets = { directory = "./dist" }

# ─── D1 (database) ────────────────────────────────────
# database_id da riempire dopo: `wrangler d1 create verbum-lucis`
# In dev locale (platformProxy) viene usato un D1 locale in .wrangler/state.
[[d1_databases]]
binding = "DB"
database_name = "verbum-lucis"
database_id = "REPLACE_AFTER_D1_CREATE"
migrations_dir = "drizzle/migrations"

# ─── KV ───────────────────────────────────────────────
# SESSION: richiesto dall'adapter per le sessioni Astro.
# CACHE: cache edge di query pesanti (liturgia del giorno, ecc.).
# In locale (platformProxy) gli id sono placeholder; per prod: `wrangler kv namespace create`.
[[kv_namespaces]]
binding = "SESSION"
id = "00000000000000000000000000000001"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000002"

# ─── R2 / AI (fase 1D) ────────────────────────────────
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "verbum-lucis-media"
#
# [ai]
# binding = "AI"
